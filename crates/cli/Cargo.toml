[package]
name = "lisem-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "lisem"
path = "src/main.rs"

[dependencies]
lisem-core = { path = "../core" }
anyhow = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
