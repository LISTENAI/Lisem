[package]
name = "lisem-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.4"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
