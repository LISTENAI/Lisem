name: Build and test
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: windows-11-arm
            target: windows-aarch64
            arch: arm64
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            directory: clangarm64
          - runner: windows-2022
            target: windows-x86_64
            arch: x64
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            directory: ucrt64
    uses: ./.github/workflows/platform.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch || '' }}
      msystem: ${{ matrix.msystem || '' }}
      prefix: ${{ matrix.prefix || '' }}
      directory: ${{ matrix.directory || '' }}
  check:
    name: All checks passed
    needs: [platform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform and phase
        env:
          RESULT: ${{ needs.platform.result }}
        run: test "$RESULT" = success
