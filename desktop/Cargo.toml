[package]
name = "lisem-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
lisem-core = { path = "../crates/core" }
gpui = { package = "gpui-kit", version = "=0.7.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
smallvec = "1"
log = "0.4"
